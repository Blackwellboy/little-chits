# Linux: host networking lets the game find model servers on this machine's localhost.
# Docker Desktop (Windows/macOS) has no host networking: use docker-compose.desktop.yml instead
# (`make docker-desktop`), which maps the port and reaches your models at http://host.docker.internal:PORT/v1.
services:
  little-chits:
    build: .
    network_mode: host
    volumes:
      - ./data:/data
    environment:
      CHITS_TOKEN: ${CHITS_TOKEN:-change-me}
      # CHITS_MODEL_URL: http://127.0.0.1:18090/v1
    restart: unless-stopped
